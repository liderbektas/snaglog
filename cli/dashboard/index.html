<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="snaglog-token" content="__CSRF__">
<title>snaglog</title>
<style nonce="__NONCE__">
:root {
  --canvas: #f1f1f2; --page: #ffffff; --side: #ffffff; --card: #ffffff; --hover: #f4f4f5; --sunken: #f7f7f8;
  --line: #e7e7ea; --line-strong: #d9d9de;
  --text: #18181b; --muted: #676b75; --faint: #9a9ea8;
  --accent: #18181b; --accent-fg: #ffffff; --link: #0969da;
  --ok: #1a7f37; --ok-bg: #e9f7ee; --ok-line: #c3e8cf;
  --bad: #c42b1c; --bad-bg: #fdeeed; --bad-line: #f6cdca;
  --warn: #9a6700; --warn-bg: #fff6e3; --warn-line: #f2deb0;
  --neutral-bg: #f2f2f4; --neutral-line: #e2e2e7;
  --chart-run: #3f3f46; --chart-bad: #e5484d; --chart-ok: #30a46c; --chart-track: #ececef;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --canvas: #08090a; --page: #111214; --side: #111214; --card: #16171a; --hover: #1c1d21; --sunken: #18191c;
  --line: #232428; --line-strong: #303237;
  --text: #ececee; --muted: #a0a3ab; --faint: #6e727b;
  --accent: #f4f4f5; --accent-fg: #111214; --link: #6cb6ff;
  --ok: #4cc38a; --ok-bg: #12261b; --ok-line: #1f4a33;
  --bad: #ff7b72; --bad-bg: #2d1515; --bad-line: #5a2421;
  --warn: #e3b341; --warn-bg: #2a2110; --warn-line: #574313;
  --neutral-bg: #1c1d21; --neutral-line: #2c2e34;
  --chart-run: #c9cbd1; --chart-bad: #ff6369; --chart-ok: #4cc38a; --chart-track: #24262b;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #08090a; --page: #111214; --side: #111214; --card: #16171a; --hover: #1c1d21; --sunken: #18191c;
    --line: #232428; --line-strong: #303237;
    --text: #ececee; --muted: #a0a3ab; --faint: #6e727b;
    --accent: #f4f4f5; --accent-fg: #111214; --link: #6cb6ff;
    --ok: #4cc38a; --ok-bg: #12261b; --ok-line: #1f4a33;
    --bad: #ff7b72; --bad-bg: #2d1515; --bad-line: #5a2421;
    --warn: #e3b341; --warn-bg: #2a2110; --warn-line: #574313;
    --neutral-bg: #1c1d21; --neutral-line: #2c2e34;
    --chart-run: #c9cbd1; --chart-bad: #ff6369; --chart-ok: #4cc38a; --chart-track: #24262b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; }
code { font-size: 12px; background: var(--sunken); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 14px; height: 14px; }
button, select, input, textarea { font: inherit; color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--card); cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { opacity: .88; background: var(--accent); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn { width: 32px; padding: 0; justify-content: center; border-color: transparent; background: transparent; color: var(--muted); }
.icon-btn:hover { color: var(--text); }
select, input[type="text"], input:not([type]), textarea { background: var(--card); border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; }
select { height: 32px; }

/* shell: two separate panels on a tinted canvas */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: 8px; padding: 8px; height: 100vh; }
.side, .main { background: var(--page); border: 1px solid var(--line); border-radius: 12px; }
.side { display: flex; flex-direction: column; padding: 12px 10px; gap: 2px; overflow-y: auto; }
.workspace { display: flex; align-items: center; gap: 10px; padding: 4px 6px 12px; }
.workspace .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--text); color: var(--page); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.workspace .name { font-weight: 600; line-height: 1.2; }
.workspace .sub { color: var(--muted); font-size: 12px; }
.search { display: flex; align-items: center; gap: 8px; height: 34px; margin: 0 0 10px; padding: 0 10px; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
.search:focus-within { border-color: var(--line-strong); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0; outline: none; color: var(--text); }
.search input::-webkit-search-cancel-button { display: none; }
.search kbd { font: 11px ui-monospace, monospace; color: var(--faint); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; }
.nav-item { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; }
.nav-item:hover { background: var(--hover); color: var(--text); text-decoration: none; }
.nav-item.active { background: var(--hover); color: var(--text); }
.nav-item .count { margin-left: auto; font-size: 12px; color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
.nav-item .count.live { color: var(--ok); }
.side-label { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; font-weight: 500; padding: 18px 10px 6px; }
.side-skill { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 13.5px; }
.side-skill:hover { background: var(--hover); color: var(--text); text-decoration: none; }
.side-skill.active { background: var(--hover); color: var(--text); font-weight: 500; }
.side-skill span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--bad); }
.dot.warn { background: var(--warn); }
.main { min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }
.topbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 32px; background: var(--page); }
.topbar .crumbs { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; min-width: 0; }
.topbar .crumbs a { color: var(--muted); }
.topbar .crumbs a:hover { color: var(--text); text-decoration: none; }
.topbar .crumbs .here { color: var(--text); font-weight: 500; }
.topbar .crumbs .ic { color: var(--faint); }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.status-pill { display: inline-flex; align-items: center; gap: 7px; height: 28px; margin-right: 6px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; cursor: default; white-space: nowrap; }
.tip { position: relative; }
.tip-box { display: none; position: absolute; right: 0; top: calc(100% + 6px); width: 280px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .10); font-size: 13px; color: var(--muted); z-index: 5; }
.tip-box strong { display: block; color: var(--text); font-weight: 600; margin-bottom: 4px; }
.tip:hover .tip-box, .tip:focus-within .tip-box { display: block; }
.content { width: 100%; max-width: 1280px; padding: 12px 32px 56px; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .main { overflow: visible; }
  .topbar, .content { padding-left: 16px; padding-right: 16px; }
}

/* page header */
.page-title { display: flex; align-items: center; gap: 12px; margin: 0 0 20px; }
.page-title h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.lead { color: var(--muted); margin: -12px 0 20px; }
h2 { font-size: 16px; font-weight: 600; margin: 28px 0 12px; }

/* notice bar (Stripe-like) */
.notice { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; background: var(--sunken); border: 1px solid var(--line); margin-bottom: 16px; font-size: 13.5px; }
.notice .ic { color: var(--muted); }
.notice strong { font-weight: 600; }
.notice.ok { background: var(--ok-bg); border-color: var(--ok-line); }
.notice.ok .ic { color: var(--ok); }
.notice.bad { background: var(--bad-bg); border-color: var(--bad-line); }
.notice.bad .ic { color: var(--bad); }
.notice.warn { background: var(--warn-bg); border-color: var(--warn-line); }
.notice.warn .ic { color: var(--warn); }

/* stat cards */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.stat { padding: 16px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.stat .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 500; }
.stat .head .ic { color: var(--faint); }
.stat .value { margin-top: 8px; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.2; }
.stat .value .unit { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.stat .value.bad { color: var(--bad); }
.stat .note { margin-top: 4px; color: var(--faint); font-size: 12px; }

/* status tabs (Stripe-like) */
.tabs-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 20px 0 16px; }
.tab-card { text-align: left; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
.tab-card:hover { border-color: var(--line-strong); }
.tab-card .t { color: var(--muted); font-size: 13px; }
.tab-card .n { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tab-card.active { border-color: var(--text); }
.tab-card.active .t { color: var(--text); }

/* underline tabs (Plane-like) */
.tabs { display: flex; gap: 4px; margin: 0 0 20px; }
.tabs button { background: none; border: 0; padding: 10px 12px; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; font-weight: 500; }
.tabs button:hover { color: var(--text); }
.tabs button.active { color: var(--text); border-bottom-color: var(--text); }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12.5px; font-weight: 500; border: 1px solid var(--neutral-line); background: var(--neutral-bg); color: var(--muted); white-space: nowrap; }
.badge .ic { width: 13px; height: 13px; stroke-width: 2.5; }
.badge.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); }
.badge.bad { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }
.badge.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }

/* tables (Stripe-like) */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
th { font-weight: 500; font-size: 13px; color: var(--muted); }
th[title] { cursor: help; }
th.sortable { cursor: pointer; user-select: none; }
th.sorted::after { content: " ↓"; color: var(--muted); }
th.sorted.asc::after { content: " ↑"; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; }
tr.row-link { cursor: pointer; }
tr.row-link:hover td { background: var(--hover); }
.cell-skill { display: flex; flex-direction: column; gap: 2px; min-width: 180px; }
.cell-skill strong { font-weight: 600; }
.cell-skill .why { color: var(--bad); font-size: 12.5px; white-space: normal; }
.cell-skill .why.info { color: var(--warn); }
.results { color: var(--muted); font-size: 13px; padding: 12px 2px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.bars rect { fill: var(--chart-track); }
.bars rect.on { fill: var(--chart-run); opacity: .55; }
.bars rect.last { fill: var(--chart-run); opacity: 1; }
.agents { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }

/* cards and charts */
.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.card h3 { margin: 0 0 14px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h3 .meta { margin-left: auto; font-weight: 400; font-size: 13px; color: var(--muted); }
.chart svg { width: 100%; height: auto; display: block; }
.chart .axis { fill: var(--faint); font-size: 12px; }
.chart .grid-line { stroke: var(--line); }
.chart .run { fill: var(--chart-run); }
.chart .bad { fill: var(--chart-bad); }
.chart .line { stroke: var(--chart-run); fill: none; stroke-width: 2.5; }
.chart .pt { fill: var(--card); stroke: var(--chart-run); stroke-width: 2.5; }
.legend { display: flex; flex-direction: column; gap: 12px; font-size: 13px; }
.legend .row { display: flex; align-items: center; gap: 10px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--chart-track); }
.legend .v { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
.legend-inline { display: flex; gap: 16px; color: var(--muted); font-size: 12.5px; margin-top: 10px; }
.legend-inline span { display: inline-flex; align-items: center; gap: 6px; }
.legend-inline i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.sw.run, .legend-inline i.run { background: var(--chart-run); }
.sw.bad, .legend-inline i.bad { background: var(--chart-bad); }
.sw.ok { background: var(--chart-ok); }
.donut-wrap { display: flex; align-items: center; gap: 28px; padding: 18px 4px; }
.donut-wrap svg { width: 150px; height: 150px; flex: none; }
.donut-wrap .legend { flex: 1; }
.donut .track { stroke: var(--chart-track); }
.donut .ok { stroke: var(--chart-ok); }
.donut .bad { stroke: var(--chart-bad); }
.donut-center { fill: var(--text); font-size: 22px; font-weight: 600; }
.donut-sub { fill: var(--muted); font-size: 11px; }

/* activity (Plane-like) */
.activity { list-style: none; margin: 0; padding: 0; }
.activity li { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.activity li:last-child { border-bottom: 0; }
.activity .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--sunken); border: 1px solid var(--line); color: var(--muted); flex: none; }
.activity .av.bad { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-line); }
.activity .av.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-line); }
.activity .av .ic { width: 14px; height: 14px; }
.activity .what strong { font-weight: 600; }
.activity .when { margin-left: auto; color: var(--faint); font-size: 12.5px; white-space: nowrap; }

/* forms, lists */
.form-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
.form-card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.form-card .head strong { font-size: 15px; }
.form-card label { display: block; color: var(--muted); font-size: 12.5px; font-weight: 500; margin-bottom: 4px; }
.form-card input, .form-card textarea { width: 100%; margin-bottom: 12px; }
.form-card textarea { min-height: 200px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
.row-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.controls label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 10px; }
.empty .ic { width: 22px; height: 22px; color: var(--faint); margin-bottom: 6px; }
dl.defs { display: grid; grid-template-columns: 170px 1fr; gap: 10px 18px; margin: 0; }
dl.defs dt { font-weight: 600; }
dl.defs dd { margin: 0; color: var(--muted); }
.delta.better { color: var(--ok); }
.delta.worse { color: var(--bad); }
.agent-list .agent { display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--line); }
.agent-list .agent:last-child { border-bottom: 0; }
.agent-list .icon { width: 36px; height: 36px; border-radius: 9px; background: var(--sunken); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); flex: none; }
.agent-list .meta { margin-left: auto; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.tips { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
</style>
</head>

<div class="app">
  <aside class="side">
    <div class="workspace"><span class="logo">s</span><div><div class="name">snaglog</div><div class="sub" id="ws-sub">local dashboard</div></div></div>
    <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Search skills" aria-label="Search skills"><kbd>/</kbd></label>
    <a class="nav-item" href="#/overview" data-page="overview"><span data-icon="layout-dashboard"></span>Skills<span class="count" data-count="skills"></span></a>
    <a class="nav-item" href="#/compare" data-page="compare"><span data-icon="git-compare-arrows"></span>Before / after</a>
    <a class="nav-item" href="#/unsent" data-page="unsent"><span data-icon="inbox"></span>Unsent reports<span class="count" data-count="unsent"></span></a>
    <a class="nav-item" href="#/connections" data-page="connections"><span data-icon="plug"></span>Connections<span class="count" data-count="live"></span></a>
    <div class="side-label"><span>Skills</span><span id="skill-total"></span></div>
    <div id="skill-list"></div>

  <div class="main" id="main">

      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <div class="right">
        <span class="status-pill" id="recv"><span class="dot" id="recv-dot"></span><span id="recv-text">Receiver</span></span>
        <span class="tip">
          <button class="btn icon-btn" type="button" aria-label="Where your data is kept" aria-describedby="privacy-tip"><span data-icon="circle-alert"></span></button>
          <span class="tip-box" role="tooltip" id="privacy-tip"><strong>Data stays on this machine</strong>Telemetry, eval results and unsent reports are stored locally. Nothing is sent anywhere until you send a report to GitHub.</span>
        </span>
        <button class="btn icon-btn" id="theme" type="button" title="Switch between light and dark" aria-label="Switch between light and dark"></button>
      </div>
    </header>
    <main class="content" id="app"><p class="muted">Loading…</p></main>
  </div>
</div>
<script nonce="__NONCE__">
'use strict';

function lineChart(points) {
  const W = 640, H = 220, L = 44, B = 28, T = 12;
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Eval score per run' });
  for (const f of [0, 0.5, 1]) {
    const y = T + (H - T - B) * (1 - f);
    svg.append(s('line', { class: 'grid-line', x1: L, x2: W - 10, y1: y, y2: y }), s('text', { class: 'axis', x: L - 8, y: y + 4, 'text-anchor': 'end' }, `${f * 100}%`));
  }
  const usable = points.filter((p) => typeof p.score === 'number');
  const stepX = usable.length > 1 ? (W - L - 60) / (usable.length - 1) : 0;
  const xy = usable.map((p, i) => [L + 30 + i * stepX, T + (H - T - B) * (1 - p.score)]);
  if (xy.length > 1) svg.append(s('polyline', { class: 'line', points: xy.map((p) => p.join(',')).join(' ') }));
  usable.forEach((p, i) => {
    svg.append(s('circle', { class: 'pt', cx: xy[i][0], cy: xy[i][1], r: 5 }, s('title', {}, `${dayYear(p.ranAt)}: ${pct(p.score)}${p.commit ? ` at ${p.commit.slice(0, 7)}` : ''}`)));
    if (i === 0 || i === usable.length - 1 || usable.length <= 6) svg.append(s('text', { class: 'axis', x: xy[i][0], y: H - 8, 'text-anchor': 'middle' }, day(p.ranAt)));
  });
  return h('div', { class: 'chart' }, svg);
}

// ---- tables -------------------------------------------------------------------
function sortableTable(columns, rows, { onRow, initial } = {}) {
  let sortKey = initial ?? null;
  let asc = false;
  const table = h('table');
  const thead = h('thead');
  const tbody = h('tbody');
  table.append(thead, tbody);
  function draw() {
    const sorted = sortKey === null ? rows : [...rows].sort((a, b) => {
      const col = columns.find((c) => c.key === sortKey);
      const va = col.sort(a);
      const vb = col.sort(b);
      if (va === vb) return 0;
      if (va === null || va === undefined) return 1;
      if (vb === null || vb === undefined) return -1;
      return (va < vb ? -1 : 1) * (asc ? 1 : -1);
    });
    thead.replaceChildren(h('tr', {}, columns.map((c) => h('th', {
      class: [c.num ? 'num' : '', c.sort ? 'sortable' : '', c.key === sortKey ? 'sorted' : '', c.key === sortKey && asc ? 'asc' : ''].join(' ').trim(),
      text: c.label,
      title: c.def ? def(c.def) : undefined,
      onclick: c.sort ? () => { asc = sortKey === c.key ? !asc : false; sortKey = c.key; draw(); } : undefined,
    }))));
    tbody.replaceChildren(...sorted.map((row) => h('tr', { class: onRow ? 'row-link' : '', onclick: onRow ? () => onRow(row) : undefined }, columns.map((c) => h('td', { class: [c.num ? 'num' : '', c.wrap ? 'wrap' : ''].join(' ').trim() }, c.cell(row))))));
  }
  draw();
  return h('div', { class: 'table-wrap' }, table);
}

function reportCard(r) {
  const status = h('span', { class: 'muted' });
  const titleIn = h('input', { value: r.title, 'aria-label': 'Title' });
  const body = h('textarea', { 'aria-label': 'Body' });
  body.value = r.body;
  const repo = h('input', { value: r.repo || '', placeholder: 'owner/repo', 'aria-label': 'Target repo' });
  let approval = r.approval;
  const dirty = () => titleIn.value !== r.title || body.value !== r.body || repo.value !== (r.repo || '');
  const send = h('button', { class: 'btn primary', type: 'button' }, icon('send'), 'Send to GitHub');
  const save = h('button', { class: 'btn', type: 'button' }, icon('save'), 'Save changes');
  const del = h('button', { class: 'btn danger', type: 'button' }, icon('trash-2'), 'Delete');
  const refreshState = () => { send.disabled = META.demo || !repo.value || dirty(); send.title = dirty() ? 'Save your changes first' : ''; };
  for (const el of [titleIn, body, repo]) el.addEventListener('input', refreshState);
  save.addEventListener('click', async () => {
    try {
      const { report } = await api(`/api/reports/${r.id}`, { method: 'PUT', body: JSON.stringify({ title: titleIn.value, body: body.value, repo: repo.value }) });
      Object.assign(r, report);
      titleIn.value = report.title; body.value = report.body; repo.value = report.repo || '';
      approval = report.approval;
      status.textContent = 'Saved (masked again).';
      refreshState();
    } catch (e) { status.textContent = e.message; }
  });
  send.addEventListener('click', async () => {
    if (!confirm(`Send this report as a GitHub issue to ${r.repo}?\n\nIt will be visible to everyone who can see that repository.`)) return;
    send.disabled = true;
    status.textContent = 'Sending…';
    try {
      const { sent } = await api(`/api/reports/${r.id}/send`, { method: 'POST', body: JSON.stringify({ approval }) });
      card.replaceChildren(h('div', { class: 'notice ok' }, icon('circle-check'), sent.status === 'commented' ? 'Added to an existing issue: ' : 'Filed: ', h('a', { href: sent.url, target: '_blank', rel: 'noopener noreferrer', text: sent.url })));
      refreshChrome().catch(() => {});
    } catch (e) { status.textContent = e.message; refreshState(); }
  });
  del.addEventListener('click', async () => {
    if (!confirm('Delete this report from this machine? This cannot be undone.')) return;
    try {
      await api(`/api/reports/${r.id}`, { method: 'DELETE' });
      card.remove();
      refreshChrome().catch(() => {});
    } catch (e) { status.textContent = e.message; }
  });
  const reasons = { unattended: 'No one to approve', rejected: 'Declined', 'no-target': 'No target repo', 'gh-missing': 'gh not installed', 'gh-not-authenticated': 'gh not logged in', 'no-access': 'No repo access', 'issues-disabled': 'Issues disabled', 'gh-error': 'gh failed' };
  const card = h('section', { class: 'form-card' },
    h('div', { class: 'head' }, h('strong', { text: r.skill }), h('span', { class: 'badge warn' }, reasons[r.reason] || r.reason), h('span', { class: 'muted', text: `kept ${ago(r.savedAt)}${r.agent ? ` · ${r.agent}` : ''}` })),
    h('label', { text: 'Title' }), titleIn, h('label', { text: 'Body' }), body, h('label', { text: 'Target repo' }), repo,
    h('div', { class: 'row-actions' }, send, save, del, status));
  refreshState();
  return card;
}

async function connectionsPage() {
  const d = await api('/api/connections');
  const recv = d.receiver;
  const live = (a) => a.lastEventAt && Date.now() - Date.parse(a.lastEventAt) < 15 * 60000;
  render(
    title('Connections', { lead: 'Which agents send telemetry to snaglog.' }),
    recv.running
      ? h('div', { class: 'notice ok' }, icon('radio'), h('strong', { text: `Receiving on 127.0.0.1:${recv.port}` }), recv.rejected ? h('span', { class: 'muted', text: `${recv.rejected} request(s) rejected; last reason: ${recv.lastRejectReason}` }) : h('span', { class: 'muted', text: 'Telemetry stays on this machine.' }))
      : h('div', { class: `notice ${recv.error ? 'bad' : ''}` }, icon('radio'), h('strong', { text: META.demo && !recv.error ? 'Demo data' : 'Receiver off' }), h('span', { class: 'muted', text: recv.error || (META.demo ? 'Demo mode shows generated data; no telemetry is collected.' : 'Started with --no-receiver.') })),
    h('div', { class: 'card agent-list' }, d.agents.map((a) => h('div', { class: 'agent' },
      h('span', { class: 'icon' }, icon('bot')),
      h('div', {}, h('strong', { text: a.label }), h('div', { class: 'muted mono', text: a.file || 'Not connected' }), live(a) ? null : h('ul', { class: 'tips' }, a.tips.map((t) => h('li', { text: t })))),
      h('div', { class: 'meta' }, live(a) ? h('span', { class: 'badge ok' }, 'Live', icon('check')) : a.connected ? h('span', { class: 'badge' }, 'Connected', icon('clock')) : h('span', { class: 'badge' }, 'Not connected'), h('div', { class: 'muted', text: `last event ${ago(a.lastEventAt)}` }))))),
    h('h2', { text: 'Not supported' }),
    h('div', { class: 'card' }, h('ul', { class: 'tips' }, d.unsupported.map((u) => h('li', {}, h('strong', { text: u.agent }), ` — ${u.reason}`)))),
  );
}

// ---- router -------------------------------------------------------------------
async function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  const name = parts[0] || 'overview';
  for (const a of document.querySelectorAll('.nav-item')) a.classList.toggle('active', a.dataset.page === (name === 'skill' ? 'overview' : name));
  try {
    await refreshChrome();
    if (name === 'skill' && parts[1]) await skillPage(parts[1], parts[2]);
    else if (name === 'compare') await comparePage(parts[1], parts[2]);
    else if (name === 'unsent') await unsentPage();
    else if (name === 'connections') await connectionsPage();
    else overviewPage();
    document.getElementById('main').scrollTo(0, 0);
    window.scrollTo(0, 0);
  } catch (e) {
    render(h('div', { class: 'notice bad' }, icon('circle-x'), h('span', { text: `Could not load data: ${e.message}` })));
  }
}
window.addEventListener('hashchange', route);
api('/api/meta').then((m) => { META = m; }).catch(() => {}).finally(route);
</script>
</body>
</html>
