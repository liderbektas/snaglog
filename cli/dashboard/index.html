<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="snaglog-token" content="__CSRF__">
<title>snaglog</title>
<style nonce="__NONCE__">
:root {
  --bg: #eef0f3; --side: #f8f9fb; --panel: #ffffff; --panel-2: #f4f5f7; --line: #e1e4e8; --line-2: #d3d7dd;
  --text: #15171a; --muted: #5d646d; --faint: #8a919a;
  --accent: #1f6feb; --good: #1a7f37; --bad: #cf3a33; --warn: #9a6700;
  --bar: #d5d9df; --bar-hi: #15171a; --bar-bad: #e5534b;
  --shadow: 0 1px 2px rgb(0 0 0 / 4%), 0 8px 24px rgb(0 0 0 / 5%);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #07080a; --side: #0d0f12; --panel: #121418; --panel-2: #181b20; --line: #22262c; --line-2: #2c3138;
  --text: #eceef1; --muted: #9aa1aa; --faint: #6b727b;
  --accent: #6cb6ff; --good: #3fb950; --bad: #f47067; --warn: #d9a43a;
  --bar: #2b3037; --bar-hi: #eceef1; --bar-bad: #f47067;
  --shadow: 0 1px 0 rgb(255 255 255 / 3%) inset, 0 12px 32px rgb(0 0 0 / 35%);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07080a; --side: #0d0f12; --panel: #121418; --panel-2: #181b20; --line: #22262c; --line-2: #2c3138;
    --text: #eceef1; --muted: #9aa1aa; --faint: #6b727b;
    --accent: #6cb6ff; --good: #3fb950; --bad: #f47067; --warn: #d9a43a;
    --bar: #2b3037; --bar-hi: #eceef1; --bar-bad: #f47067;
    --shadow: 0 1px 0 rgb(255 255 255 / 3%) inset, 0 12px 32px rgb(0 0 0 / 35%);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; }
code { font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 6px; }
button, select, input, textarea { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
button { padding: 7px 14px; cursor: pointer; }
button:hover { border-color: var(--line-2); }
button.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; cursor: not-allowed; }
input, select, textarea { padding: 7px 10px; }

/* layout */
.app { display: grid; grid-template-columns: 268px 1fr; min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; padding: 20px 16px; background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; font-weight: 650; font-size: 16px; letter-spacing: -0.01em; }
.brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--text); color: var(--bg); display: grid; place-items: center; }
.search { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.search input { border: 0; background: transparent; padding: 0; outline: none; width: 100%; }
.search .key { color: var(--faint); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--text); text-decoration: none; }
.nav a:hover { background: var(--panel-2); }
.nav a.active { background: var(--panel); box-shadow: var(--shadow); }
.nav .count { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.nav .count.live { color: var(--good); }
.nav svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; color: var(--muted); }
.section-title { display: flex; align-items: center; justify-content: space-between; padding: 0 10px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
.skill-list { display: flex; flex-direction: column; gap: 1px; }
.skill-list a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; color: var(--text); text-decoration: none; }
.skill-list a:hover { background: var(--panel-2); }
.skill-list a.active { background: var(--panel); box-shadow: var(--shadow); }
.skill-list .uses { margin-left: auto; color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.side-foot button { margin-left: auto; padding: 5px 10px; font-size: 12.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.good { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 18%, transparent); }
.dot.bad { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 18%, transparent); }
.dot.warn { background: var(--warn); }
.main { min-width: 0; padding: 28px 32px 48px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
.page-head .sub { margin: 4px 0 0; color: var(--muted); }
.page-head .tag { margin-left: auto; color: var(--muted); font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .main { padding: 20px 16px 40px; }
}

/* panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; box-shadow: var(--shadow); }
.panel + .panel, .grid + .panel, .panel + .grid, .grid + .grid { margin-top: 16px; }
.panel-head { display: flex; align-items: center; gap: 10px; margin: -2px 0 14px; }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.panel-head .meta { color: var(--muted); font-size: 13px; }
.panel-head .right { margin-left: auto; }
.grid { display: grid; gap: 16px; align-items: stretch; }
.grid > .panel { margin-top: 0; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.two { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .two { grid-template-columns: 1fr; } }
.kpi { display: flex; flex-direction: column; gap: 6px; min-height: 118px; }
.kpi .label { color: var(--muted); font-size: 13px; cursor: help; text-decoration: underline dotted var(--line-2); text-underline-offset: 3px; width: fit-content; }
.kpi .value { font-size: 34px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .value .unit { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.kpi .note { color: var(--muted); font-size: 12.5px; margin-top: auto; }
.kpi .value.bad { color: var(--bad); }
.bars { display: block; }
.bars rect { fill: var(--bar); }
.bars rect.hi { fill: var(--bar-hi); }
.bars rect.bad { fill: var(--bar-bad); }
.banner { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; display: flex; gap: 10px; align-items: baseline; }
.banner::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; transform: translateY(-1px); }
.banner.good::before { background: var(--good); }
.banner.bad::before { background: var(--bad); }
.banner.info::before { background: var(--accent); }

/* tables */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-weight: 500; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
th[title] { cursor: help; text-decoration: underline dotted var(--line-2); text-underline-offset: 3px; }
th.sortable { cursor: pointer; user-select: none; }
th.sorted::after { content: " ↓"; }
th.sorted.asc::after { content: " ↑"; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.row-link { cursor: pointer; }
tr.row-link:hover td { background: var(--panel-2); }
tr.row-link td:first-child { border-radius: 10px 0 0 10px; }
tr.row-link td:last-child { border-radius: 0 10px 10px 0; }
.skill-cell { display: flex; gap: 12px; align-items: flex-start; }
.skill-cell .dot { margin-top: 7px; }
.skill-cell strong { font-weight: 600; white-space: nowrap; }
.reasons { margin: 2px 0 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--bad); }
.reasons li.info { color: var(--warn); }
.subtle { color: var(--muted); font-size: 12.5px; }
.muted { color: var(--muted); }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); margin-right: 4px; }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }

/* activity log */
.log { margin: 0; padding: 0; list-style: none; font-size: 12.5px; max-height: 330px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 74px 96px 1fr auto; gap: 12px; padding: 5px 2px; border-bottom: 1px solid var(--line); }
.log li:last-child { border-bottom: 0; }
.log .t { color: var(--faint); }
.log .a { color: var(--muted); }
.log .k.error { color: var(--bad); }
.log .k.invoked { color: var(--accent); }
.log .k.completed { color: var(--good); }
.log .d { color: var(--faint); text-align: right; }

/* charts */
.chart svg { width: 100%; height: auto; display: block; }
.chart .axis { fill: var(--faint); font-size: 11px; }
.chart .grid-line { stroke: var(--line); }
.chart .bar { fill: var(--bar-hi); opacity: .85; }
.chart .bar-bad { fill: var(--bar-bad); }
.chart .line { stroke: var(--accent); fill: none; stroke-width: 2; }
.chart .dotp { fill: var(--accent); }
.legend { color: var(--muted); font-size: 12px; margin-top: 8px; display: flex; gap: 16px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
.legend .i-run { background: var(--bar-hi); }
.legend .i-bad { background: var(--bar-bad); }

/* forms and misc */
.report textarea { width: 100%; min-height: 220px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; margin: 4px 0 12px; }
.report input { width: 100%; margin: 4px 0 12px; }
.report label { color: var(--muted); font-size: 12.5px; }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; color: var(--muted); }
.empty { color: var(--muted); }
details.defs { margin-top: 16px; }
details.defs summary { cursor: pointer; color: var(--muted); }
details.defs dl { display: grid; grid-template-columns: 160px 1fr; gap: 8px 16px; margin: 14px 0 0; }
details.defs dt { font-weight: 600; }
details.defs dd { margin: 0; color: var(--muted); }
.agent-row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.agent-row + .agent-row { margin-top: 10px; }
.agent-row .name { font-weight: 600; }
.agent-row .right { margin-left: auto; text-align: right; }
.tips { margin: 8px 0 0 22px; padding: 0; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 11.5c1.6 1.3 3.2 1.9 5 1.9 2 0 3.5-.9 3.5-2.5 0-1.5-1.2-2.1-3.4-2.6C5.8 7.8 4.6 7.2 4.6 5.6 4.6 4 6 3 8 3c1.5 0 2.8.5 3.9 1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>snaglog</div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="search" type="search" placeholder="Search skills" aria-label="Search skills"><span class="key">/</span></label>
    <nav class="nav" id="nav">
      <a href="#/overview" data-page="overview"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/></svg>Overview<span class="count" data-count="skills"></span></a>
      <a href="#/compare" data-page="compare"><svg viewBox="0 0 16 16"><path d="M4 3v10M12 3v10M4 8h8M9.5 5.5 12 8l-2.5 2.5"/></svg>Before / after</a>
      <a href="#/unsent" data-page="unsent"><svg viewBox="0 0 16 16"><path d="M2.5 4.5h11v8h-11z"/><path d="m2.5 4.5 5.5 4.5 5.5-4.5"/></svg>Unsent reports<span class="count" data-count="unsent"></span></a>
      <a href="#/connections" data-page="connections"><svg viewBox="0 0 16 16"><path d="M8 13.5a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11Z"/><path d="M8 5v3l2 1.5"/></svg>Connections<span class="count" data-count="live"></span></a>
    </nav>
    <div class="section-title"><span>Skills</span><span id="skill-total"></span></div>
    <div class="skill-list" id="skill-list"></div>
    <div class="side-foot"><span class="dot" id="recv-dot"></span><span id="recv-text">Receiver</span><button id="theme" type="button" title="Switch between light and dark">Theme</button></div>
  </aside>
  <main class="main" id="app"><p class="muted">Loading…</p></main>
</div>
<script nonce="__NONCE__">
'use strict';
const TOKEN = document.querySelector('meta[name="snaglog-token"]').content;
const app = document.getElementById('app');
const SVGNS = 'http://www.w3.org/2000/svg';
let META = { demo: false };
let ROWS = [];

// What each metric means (shown on hover and on the skill page).
const DEFS = {
  runs: ['Runs', 'How many times an agent started this skill.'],
  uses30: ['Uses (30 d)', 'Runs of this skill in the last 30 days.'],
  errorRate: ['Tool error rate', 'Share of the tool calls made while this skill was active that failed.'],
  cleanRate: ['Clean runs', 'Runs that finished without a single failed tool call. A run that recovered from an error does not count as clean.'],
  retries: ['Avg retries', 'How often a failed tool call was immediately tried again, per run.'],
  duration: ['Avg duration', 'Time from the skill starting until the agent finished that request: the whole job the skill was part of.'],
  tokens: ['Avg tokens', 'Tokens processed per run. Includes the prompt cache, which the model re-reads on every step, so it is usually most of the total.'],
  cost: ['Avg cost', "The agent's own estimate at API prices. On a subscription this counts toward your usage limit; it is not charged separately."],
  snags: ['Open snags', 'Open GitHub issues reporting this skill. Repeats of the same problem are counted as reports, not as new snags.'],
  evalScore: ['Eval score', 'Share of eval cases passing in the latest snaglog eval of this skill.'],
  effect: ['Skill effect', 'Eval score with the skills minus without them, from a run with --ablate. Positive means the skills help.'],
  agents: ['Agents', 'Agents that used this skill.'],
};
const def = (key) => DEFS[key][1];

// ---- helpers: data is only ever inserted as text -------------------------
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
function s(tag, attrs, ...children) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, String(v));
  for (const c of children.flat()) if (c !== null && c !== undefined) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { 'content-type': 'application/json', 'x-snaglog-token': TOKEN, ...(options.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}
const pct = (v) => (v === null || v === undefined ? '—' : `${Math.round(v * 100)}%`);
const signedPts = (v) => (v === null || v === undefined ? '—' : `${v >= 0 ? '+' : ''}${Math.round(v * 100)} pts`);
const num = (v, digits = 0) => (v === null || v === undefined ? '—' : Number(v).toLocaleString('en-US', { maximumFractionDigits: digits }));
const compact = (v) => (v === null || v === undefined ? '—' : Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(v));
const durParts = (ms) => (ms === null || ms === undefined ? ['—', ''] : ms < 1000 ? [String(Math.round(ms)), 'ms'] : ms < 120000 ? [(ms / 1000).toFixed(1), 's'] : [(ms / 60000).toFixed(1), 'min']);
const dur = (ms) => durParts(ms).join(' ').trim();
const usd = (v) => (v === null || v === undefined ? '—' : `$${v.toFixed(v < 1 ? 3 : 2)}`);
const day = (iso) => (iso ? iso.slice(0, 10) : '—');
const clock = (iso) => (iso ? new Date(iso).toLocaleTimeString('en-GB', { hour12: false }) : '');
const ago = (iso) => {
  if (!iso) return 'never';
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  if (m < 48 * 60) return `${Math.round(m / 60)} h ago`;
  return `${Math.round(m / 1440)} days ago`;
};
const statusOf = (r) => (r.attention.reasons.some((x) => !x.startsWith('every eval')) ? 'bad' : r.usage30d ? 'good' : '');
function page(title, sub, ...children) {
  const head = h('div', { class: 'page-head' }, h('div', {}, h('h1', { text: title }), sub ? h('p', { class: 'sub', text: sub }) : null), META.demo ? h('span', { class: 'tag', text: 'Demo data · sending disabled' }) : null);
  app.replaceChildren(head, ...children);
}
function failure(error) {
  app.replaceChildren(h('div', { class: 'banner bad', text: `Could not load data: ${error.message}` }));
}
function panel(title, meta, ...children) {
  return h('section', { class: 'panel' }, title ? h('div', { class: 'panel-head' }, h('h2', { text: title }), meta ? h('span', { class: 'meta', text: meta }) : null) : null, ...children);
}
function kpi(defKey, value, unit, { cls, note } = {}) {
  return h('div', { class: 'panel kpi', title: def(defKey) },
    h('span', { class: 'label', text: DEFS[defKey][0] }),
    h('span', { class: `value ${cls || ''}` }, value, unit ? h('span', { class: 'unit', text: unit }) : null),
    note ? h('span', { class: 'note', text: note }) : null);
}
function miniBars(values, { width = 120, height = 26 } = {}) {
  const max = Math.max(1, ...values);
  const gap = 3;
  const bw = (width - gap * (values.length - 1)) / values.length;
  const svg = s('svg', { class: 'bars', width, height, viewBox: `0 0 ${width} ${height}`, 'aria-hidden': 'true' });
  values.forEach((v, i) => {
    const bh = Math.max(3, (height * v) / max);
    svg.append(s('rect', { class: i === values.length - 1 ? 'hi' : '', x: i * (bw + gap), y: height - bh, width: bw, height: bh, rx: 1.5 }));
  });
  return svg;
}

// ---- theme ------------------------------------------------------------------
function applyTheme(theme) {
  if (theme) document.documentElement.dataset.theme = theme;
  else delete document.documentElement.dataset.theme;
}
(function initTheme() {
  const fromUrl = new URLSearchParams(location.search).get('theme');
  let saved = null;
  try { saved = localStorage.getItem('snaglog-theme'); } catch { /* storage may be blocked */ }
  applyTheme(fromUrl || saved);
})();
document.getElementById('theme').addEventListener('click', () => {
  const current = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('snaglog-theme', next); } catch { /* ignore */ }
});

// ---- sidebar ------------------------------------------------------------------
const searchInput = document.getElementById('search');
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
    e.preventDefault();
    searchInput.focus();
  }
});
searchInput.addEventListener('input', () => {
  renderSkillList(currentSkill());
  if ((location.hash || '#/overview').startsWith('#/overview') || location.hash === '') overviewPage();
});
const matches = (name) => name.toLowerCase().includes(searchInput.value.trim().toLowerCase());
function currentSkill() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);

// ---- charts -------------------------------------------------------------------
function barChart(days) {
  const W = 760, H = 330, L = 30, B = 26, T = 10;
  const max = Math.max(1, ...days.map((d) => d.invocations));
  const bw = (W - L) / days.length;
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Runs per day, last 30 days' });
  for (const f of [0, 0.5, 1]) {
    const y = T + (H - T - B) * (1 - f);
    svg.append(s('line', { class: 'grid-line', x1: L, x2: W, y1: y, y2: y }), s('text', { class: 'axis', x: L - 8, y: y + 4, 'text-anchor': 'end' }, String(Math.round(max * f))));
  }
  days.forEach((d, i) => {
    const x = L + i * bw + 2;
    const hTotal = ((H - T - B) * d.invocations) / max;
    const g = s('g', {}, s('title', {}, `${d.day}: ${d.invocations} runs, ${d.failedRuns} with tool errors`));
    if (d.invocations) g.append(s('rect', { class: 'bar', x, y: H - B - hTotal, width: Math.max(1, bw - 4), height: hTotal, rx: 3 }));
    if (d.failedRuns) {
      const he = Math.min(hTotal, ((H - T - B) * d.failedRuns) / max);
      g.append(s('rect', { class: 'bar-bad', x, y: H - B - he, width: Math.max(1, bw - 4), height: he, rx: 3 }));
    }
    svg.append(g);
    const last = i === days.length - 1;
    if ((i % 7 === 0 && days.length - 1 - i >= 4) || last) svg.append(s('text', { class: 'axis', x: last ? x + bw - 4 : x + bw / 2, y: H - 6, 'text-anchor': last ? 'end' : 'middle' }, d.day.slice(5)));
  });
  return h('div', { class: 'chart' }, svg, h('div', { class: 'legend' }, h('span', {}, h('i', { class: 'i-run' }), 'runs'), h('span', {}, h('i', { class: 'i-bad' }), 'runs with tool errors')));
}
function lineChart(points) {
  const W = 1000, H = 190, L = 44, B = 24, T = 10;
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Eval score per run' });
  for (const f of [0, 0.5, 1]) {
    const y = T + (H - T - B) * (1 - f);
    svg.append(s('line', { class: 'grid-line', x1: L, x2: W - 10, y1: y, y2: y }), s('text', { class: 'axis', x: L - 8, y: y + 4, 'text-anchor': 'end' }, `${f * 100}%`));
  }
  const usable = points.filter((p) => typeof p.score === 'number');
  const step = usable.length > 1 ? (W - L - 60) / (usable.length - 1) : 0;
  const xy = usable.map((p, i) => [L + 30 + i * step, T + (H - T - B) * (1 - p.score)]);
  if (xy.length > 1) svg.append(s('polyline', { class: 'line', points: xy.map((p) => p.join(',')).join(' ') }));
  usable.forEach((p, i) => {
    svg.append(s('circle', { class: 'dotp', cx: xy[i][0], cy: xy[i][1], r: 4.5 }, s('title', {}, `${day(p.ranAt)}: ${pct(p.score)}${p.commit ? ` at ${p.commit.slice(0, 7)}` : ''}`)));
    if (i === 0 || i === usable.length - 1 || usable.length <= 6) svg.append(s('text', { class: 'axis', x: xy[i][0], y: H - 6, 'text-anchor': 'middle' }, day(p.ranAt).slice(5)));
  });
  return h('div', { class: 'chart' }, svg);
}

// ---- tables -------------------------------------------------------------------
function sortableTable(columns, rows, { onRow, initial } = {}) {
  let sortKey = initial ?? null;
  let asc = false;
  const table = h('table');
  const thead = h('thead');
  const tbody = h('tbody');
  table.append(thead, tbody);
  function render() {
    const sorted = sortKey === null ? rows : [...rows].sort((a, b) => {
      const col = columns.find((c) => c.key === sortKey);
      const va = col.sort(a);
      const vb = col.sort(b);
      if (va === vb) return 0;
      if (va === null || va === undefined) return 1;
      if (vb === null || vb === undefined) return -1;
      return (va < vb ? -1 : 1) * (asc ? 1 : -1);
    });
    thead.replaceChildren(h('tr', {}, columns.map((c) => h('th', {
      class: [c.num ? 'num' : '', c.sort ? 'sortable' : '', c.key === sortKey ? 'sorted' : '', c.key === sortKey && asc ? 'asc' : ''].join(' ').trim(),
      text: c.label,
      title: c.def ? def(c.def) : undefined,
      onclick: c.sort ? () => { asc = sortKey === c.key ? !asc : false; sortKey = c.key; render(); } : undefined,
    }))));
    tbody.replaceChildren(...sorted.map((row) => h('tr', { class: onRow ? 'row-link' : '', onclick: onRow ? () => onRow(row) : undefined }, columns.map((c) => h('td', { class: c.num ? 'num' : '' }, c.cell(row))))));
  }
  render();
  return table;
}

function reportCard(r) {
  const status = h('span', { class: 'subtle' });
  const title = h('input', { value: r.title, 'aria-label': 'Title' });
  const body = h('textarea', { 'aria-label': 'Body' });
  body.value = r.body;
  const repo = h('input', { value: r.repo || '', placeholder: 'owner/repo', 'aria-label': 'Target repo' });
  let approval = r.approval;
  const dirty = () => title.value !== r.title || body.value !== r.body || repo.value !== (r.repo || '');
  const send = h('button', { class: 'primary', type: 'button', text: 'Send to GitHub' });
  const save = h('button', { type: 'button', text: 'Save changes' });
  const del = h('button', { class: 'danger', type: 'button', text: 'Delete' });
  const refreshState = () => { send.disabled = META.demo || !repo.value || dirty(); send.title = dirty() ? 'Save your changes first' : ''; };
  for (const el of [title, body, repo]) el.addEventListener('input', refreshState);
  save.addEventListener('click', async () => {
    try {
      const { report } = await api(`/api/reports/${r.id}`, { method: 'PUT', body: JSON.stringify({ title: title.value, body: body.value, repo: repo.value }) });
      Object.assign(r, report);
      title.value = report.title; body.value = report.body; repo.value = report.repo || '';
      approval = report.approval;
      status.textContent = 'Saved (masked again).';
      refreshState();
    } catch (e) { status.textContent = e.message; }
  });
  send.addEventListener('click', async () => {
    if (!confirm(`Send this report as a GitHub issue to ${r.repo}?\n\nIt will be visible to everyone who can see that repository.`)) return;
    send.disabled = true;
    status.textContent = 'Sending…';
    try {
      const { sent } = await api(`/api/reports/${r.id}/send`, { method: 'POST', body: JSON.stringify({ approval }) });
      cardEl.replaceChildren(h('p', {}, sent.status === 'commented' ? 'Added to an existing issue: ' : 'Filed: ', h('a', { href: sent.url, target: '_blank', rel: 'noopener noreferrer', text: sent.url })));
      refreshSidebar().catch(() => {});
    } catch (e) { status.textContent = e.message; refreshState(); }
  });
  del.addEventListener('click', async () => {
    if (!confirm('Delete this report from this machine? This cannot be undone.')) return;
    try {
      await api(`/api/reports/${r.id}`, { method: 'DELETE' });
      cardEl.remove();
      refreshSidebar().catch(() => {});
    } catch (e) { status.textContent = e.message; }
  });
  const cardEl = h('section', { class: 'panel report' },
    h('div', { class: 'panel-head' }, h('h2', { text: r.skill }), h('span', { class: 'pill', text: r.reason }), h('span', { class: 'meta', text: `kept ${ago(r.savedAt)}${r.agent ? ` · ${r.agent}` : ''}` })),
    h('label', {}, 'Title', title), h('label', {}, 'Body', body), h('label', {}, 'Target repo', repo),
    h('div', { class: 'actions' }, save, send, del, status));
  refreshState();
  return cardEl;
}

async function connectionsPage() {
  const d = await api('/api/connections');
  const recv = d.receiver;
  const live = (a) => a.lastEventAt && Date.now() - Date.parse(a.lastEventAt) < 15 * 60000;
  page('Connections', 'Which agents send telemetry to snaglog.',
    h('div', { class: `banner ${recv.running ? 'good' : recv.error ? 'bad' : 'info'}` }, recv.running
      ? h('span', {}, `Receiver listening on 127.0.0.1:${recv.port}.`, recv.rejected ? h('span', { class: 'subtle', text: ` ${recv.rejected} request(s) rejected; last reason: ${recv.lastRejectReason}.` }) : '')
      : h('span', { text: recv.error ? `Receiver not running: ${recv.error}` : 'Receiver not running (demo mode or --no-receiver).' })),
    panel('Agents', `${d.agents.filter(live).length} live`, ...d.agents.map((a) => h('div', { class: 'agent-row' },
      h('span', { class: `dot ${live(a) ? 'good' : a.connected ? 'warn' : ''}` }),
      h('div', {}, h('div', { class: 'name', text: a.label }), h('div', { class: 'subtle mono', text: a.file || 'not connected' }),
        live(a) ? null : h('ul', { class: 'tips' }, a.tips.map((t) => h('li', { text: t })))),
      h('div', { class: 'right' }, h('div', { text: a.connected ? (live(a) ? 'live' : 'connected') : 'not connected' }), h('div', { class: 'subtle', text: `last event ${ago(a.lastEventAt)}` }))))),
    panel('Not supported', null, h('ul', { class: 'tips' }, d.unsupported.map((u) => h('li', {}, h('strong', { text: u.agent }), ` — ${u.reason}`)))),
  );
}

// ---- router -------------------------------------------------------------------
async function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  const name = parts[0] || 'overview';
  for (const a of document.querySelectorAll('#nav a')) a.classList.toggle('active', a.dataset.page === name);
  try {
    await refreshSidebar();
    if (name === 'skill' && parts[1]) await skillPage(parts[1]);
    else if (name === 'compare') await comparePage(parts[1], parts[2]);
    else if (name === 'unsent') await unsentPage();
    else if (name === 'connections') await connectionsPage();
    else overviewPage();
  } catch (e) { failure(e); }
}
window.addEventListener('hashchange', route);
api('/api/meta').then((m) => { META = m; }).catch(() => {}).finally(route);
</script>
</body>
</html>
